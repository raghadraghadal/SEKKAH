name: System Reliability Test

on:
  workflow_dispatch: # يتيح لكِ تشغيل الاختبار يدوياً بضغطة زر

jobs:
  reliability_check:
    name: Run 150 Requests Performance Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Artillery (Testing Tool)
        run: npm install -g artillery@latest

      - name: Execute 150 Requests Simulation
        run: |
          artillery quick https://httpbin.org -c 15 -n 10
