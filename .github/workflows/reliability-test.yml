name: System Reliability Test

on:
  workflow_dispatch: # يتيح لكِ تشغيل الاختبار يدوياً بضغطة زر في أي وقت

jobs:
  reliability_check:
    name: Run 150 Requests Performance Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20

      - name: Install Artillery (Testing Tool)
        run: npm install -g artillery@latest

      - name: Execute 150 Requests Simulation
        run: |
          artillery quick --duration 10 --rate 15 https://your-project-link.com
